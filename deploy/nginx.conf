upstream gpt2api_backend {
    server server:8080;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 32m;

    # SSE / streaming 友好
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;

    # 前端静态资源由 nginx 托管,后端只处理 API 和动态资源。
    root /usr/share/nginx/html;
    index index.html;

    # OpenAI 兼容接口
    location /v1/ {
        proxy_pass http://gpt2api_backend;
    }

    # 业务 API
    location = /api/me/video-workflows {
        client_max_body_size 320m;
        proxy_pass http://gpt2api_backend;
    }

    location ^~ /api/me/video-workflows/ {
        client_max_body_size 320m;
        proxy_pass http://gpt2api_backend;
    }

    location ^~ /api/me/video-assets {
        client_max_body_size 320m;
        proxy_pass http://gpt2api_backend;
    }

    location /api/ {
        proxy_pass http://gpt2api_backend;
    }

    # 兼容旧前端包使用的网关前缀
    location /_gateway/ {
        proxy_pass http://gpt2api_backend;
    }

    # 健康检查
    location /healthz {
        proxy_pass http://gpt2api_backend;
        access_log off;
    }

    location /readyz {
        proxy_pass http://gpt2api_backend;
        access_log off;
    }

    # 图片签名代理
    location /p/img/ {
        proxy_pass http://gpt2api_backend;
    }

    # 视频画布签名素材，保留 Range 头以支持视频拖动播放。
    location ^~ /p/vwf/ {
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_force_ranges on;
        proxy_buffering on;
        proxy_pass http://gpt2api_backend;
        access_log off;
    }

    # 后台上传的站点资源
    location /site-assets/ {
        proxy_pass http://gpt2api_backend;
    }

    # 电商资产库上传资源由 nginx 直接托管，支持高效 Range/零拷贝发送。
    location /ecommerce-assets/ {
        alias /usr/share/nginx/ecommerce-assets/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Accept-Ranges bytes always;
        try_files $uri =404;
    }

    # 前端 SPA 兜底
    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
