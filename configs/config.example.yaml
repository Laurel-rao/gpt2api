app:
  name: gpt2api
  env: dev              # dev | prod
  listen: ":8080"
  base_url: "http://localhost:8080"

log:
  level: info           # debug | info | warn | error
  format: console       # console | json
  output: stdout        # stdout | /var/log/gpt2api.log

mysql:
  dsn: "gpt2api:gpt2api@tcp(127.0.0.1:3306)/gpt2api?parseTime=true&loc=Local&charset=utf8mb4&collation=utf8mb4_unicode_ci"
  # 开发期 100 够用;生产目标 2000 chat SSE + 1000 图,推荐 500,MySQL 侧 max_connections>=1000
  max_open_conns: 100
  max_idle_conns: 20
  conn_max_lifetime_sec: 3600

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0
  # 开发期 100;生产推荐 500(锁 + 队列 + 令牌桶并发高)
  pool_size: 100

jwt:
  secret: "CHANGE_ME_TO_RANDOM_32_BYTES_SECRET"
  access_ttl_sec: 86400
  refresh_ttl_sec: 2592000
  issuer: "gpt2api"

crypto:
  # 32 字节 hex(64 字符),用于 AES-256-GCM 加密账号 AT / cookies
  aes_key: "CHANGE_ME_TO_64_HEX_CHARS_AES_256_KEY_000000000000000000000000"

security:
  bcrypt_cost: 10
  cors_origins:
    - "http://localhost:5173"
    - "http://localhost:5174"

# 账号池调度
scheduler:
  min_interval_sec: 60
  daily_usage_ratio: 0.6          # 单号日消耗熔断阈值
  lock_ttl_sec: 1200
  cooldown_429_sec: 600           # 连续 429 冷却
  warned_pause_hours: 24

# 上游 chatgpt.com
upstream:
  base_url: "https://chatgpt.com"
  request_timeout_sec: 60
  sse_read_timeout_sec: 300

# AI Zero Token / OpenAI-compatible 生图网关
# API Key 默认从 AZT_API_KEY 环境变量读取,不要把真实密钥写入配置文件。
imagegen:
  base_url: "http://123.207.53.152/v1"
  api_key: ""
  api_key_env: "AZT_API_KEY"
  timeout_sec: 420
  quality: "low"
  background: "auto"
  output_format: "png"
  response_format: "b64_json"

# AI Zero Token / OpenAI-compatible 文本网关
textgen:
  base_url: "http://123.207.53.152/v1"
  api_key: ""
  api_key_env: "AZT_API_KEY"
  model: "gpt-5.4"
  timeout_sec: 120

# AI Gen Platform 视频网关
# API Key 默认从 AI_GEN_API_KEY 环境变量读取,也可在后台系统设置页面配置。
videogen:
  channel_type: "echoon" # echoon / apiyi_seedance2 / apiyi_wan27 / apiyi_happyhorse
  base_url: "http://app.echoon.top/api/v1"
  api_key: ""
  api_key_env: "AI_GEN_API_KEY"
  model: "0e37fa2d-72b3-483a-81b4-ad595cd147c7"
  apiyi_seedance2:
    base_url: "https://api.apiyi.com"
    api_key: ""
    model: "doubao-seedance-2-0-fast-260128"
  apiyi_wan27:
    base_url: "https://api.apiyi.com"
    api_key: ""
    model: "wan2.7-r2v"
  apiyi_happyhorse:
    base_url: "https://api.apiyi.com"
    api_key: ""
    model: "happyhorse-1.0-r2v"
  timeout_sec: 1800
  duration_sec: 5
  aspect_ratio: "16:9"
  resolution: "720p"
  generate_audio: false

# 桌面端视频画布：素材版本、签名媒体和数据库租约执行器。
video_workflow:
  enabled: true
  accept_new_runs: true
  asset_dir: "/app/data/video-workflow-assets"
  signing_secret: ""                 # 生产环境用 GPT2API_VIDEO_WORKFLOW_SIGNING_SECRET 注入至少 32 字节随机值
  public_base_url: ""                 # 生产必填：上游可访问的真实公网 http(s) 源；example.com/localhost 会被拒绝
  worker_concurrency: 4
  image_concurrency: 2
  video_concurrency: 2
  compose_concurrency: 1
  heartbeat_sec: 10
  lease_ttl_sec: 60
  recovery_scan_sec: 30
  approval_ttl_sec: 259200           # 72 小时
  preview_url_ttl_sec: 900           # 15 分钟
  download_url_ttl_sec: 300          # 5 分钟
  provider_url_ttl_sec: 3600         # 上游视频下载链接最多缓存 60 分钟
  estimate_ttl_sec: 300              # 费用确认令牌 5 分钟有效
  user_quota_bytes: 5368709120       # 每用户 5 GiB
  image_max_bytes: 20971520          # 单图 20 MiB
  video_max_bytes: 314572800         # 单视频 300 MiB
  image_credit_per_output: 500000    # 与 gpt-image-2 默认单图定价一致（厘）
  text_credit_per_node: 10000        # 单次结构化分镜文本上限（厘）
  video_credit_per_clip: 100000      # 与默认视频体验预扣一致（厘）
  ffmpeg_bin: "ffmpeg"
  ffprobe_bin: "ffprobe"

# 电商生成
ecommerce:
  image_concurrency: 1             # 电商图片全局并发数;默认 1,可用 GPT2API_ECOMMERCE_IMAGE_CONCURRENCY 覆盖

# 支付(易支付)
epay:
  gateway_url: ""
  pid: ""
  key: ""
  notify_url: ""
  return_url: ""
  sign_type: "MD5"
  expires_min: 30

smtp:
  host: ""
  port: 465
  username: ""
  password: ""
  from: ""
  from_name: "GPT2API"
  use_tls: true
